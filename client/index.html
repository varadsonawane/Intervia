<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Identity -->
    <title>Intervia — AI-Powered Interview Preparation</title>

    <meta
      name="description"
      content="Practice real-time AI voice interviews, receive personalized feedback, and build the confidence to succeed in your next job interview with Intervia."
    />

    <meta name="application-name" content="Intervia" />

    <meta name="theme-color" content="#f5f3ff" />

    <!-- SEO -->
    <meta
      name="keywords"
      content="AI interview preparation, mock interviews, AI interviewer, interview practice, technical interview preparation"
    />

    <meta name="author" content="Intervia" />

    <!-- Open Graph: Social Media Sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Intervia — Practice Smarter. Interview Better."
    />

    <meta
      property="og:description"
      content="Prepare for your next interview with AI-powered voice conversations, personalized feedback, and interview performance insights."
    />

    <meta property="og:site_name" content="Intervia" />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Intervia — AI Interview Preparation"
    />

    <meta
      name="twitter:description"
      content="Practice interviews with AI, improve your answers, and become interview-ready."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Performance -->
    <meta name="color-scheme" content="light" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
